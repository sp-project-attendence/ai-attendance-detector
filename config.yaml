# M2 identity thresholds. Tune identity_threshold and identity_margin on a
# separate labelled validation session before relying on any recognition.
identity_threshold: 0.363
identity_margin: 0.05
min_face_samples: 2
per_track_samples: 12
min_sample_separation_sec: 0.75
min_face_px: 20
min_sharpness: 20.0
face_detection_score: 0.55
identity_stitch_max_gap_sec: 8.0
visibility_gap_tolerance_sec: 15.0
spatial_stitch_max_gap_sec: 5.0
spatial_stitch_distance_heights: 0.5
tracker_stride: 2
tracker_confidence: 0.15
tracker_image_size: 960
tracker_model: yolo11s.pt
tracker_name: bytetrack.yaml

# M3 presence/report thresholds. Late and early flags are emitted only when
# session.json supplies scheduled_start and scheduled_end.
gap_tol_sec: 15
late_first_seen_fraction: 0.10
early_last_seen_fraction: 0.10
multiple_gaps_min_count: 2
long_gap_sec: 60
low_visibility_percent: 40
medium_confidence_score: 55
high_confidence_score: 75
confidence_sample_target: 5
